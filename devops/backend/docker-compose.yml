services:
  backend:
    container_name: cd-backend
    hostname: cd-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "29351:8000"
    volumes:
      - cd-backend-volume-code:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: cd-db
      DB_PORT: 3306
      DB_DATABASE: cdtest
      DB_USERNAME: root
      DB_PASSWORD: cdmon
    networks:
      - cd-network
    command: >
      bash -c "
        sleep 10 &&
        composer install &&
        php artisan key:generate &&
        php artisan migrate --force &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
volumes:
  cd-backend-volume-code:
    external: true

networks:
  cd-network:
    external: true
